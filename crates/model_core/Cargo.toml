[package]
name = "model_core"
version = "0.1.0"
edition = "2021"
description = "Parametric document model, feature timeline and (later) sketch solver and CAM logic"
license = "MIT"
publish = false

[lib]
# staticlib: linked into the C++ app by CMake. rlib: used by `cargo test`.
crate-type = ["staticlib", "rlib"]

[features]
# `ffi` builds the CXX bridge to the C++ geometry layer (Open CASCADE).
# CMake always enables it. Plain `cargo test` leaves it off and runs the pure
# Rust tests against a mock kernel, so no C++ toolchain or OCCT is needed.
default = []
ffi = ["dep:cxx", "dep:cxx-build"]

[dependencies]
cxx = { version = "1.0", optional = true }
# 2D sketch constraint solver from MitCad (MIT). Only src/sketch/solver_adapter.rs
# uses it. Pinned to a release tag; .github/workflows/update-solver.yml opens a
# pull request when MitCad publishes a newer release.
mitcad-solver = { git = "https://github.com/mitcad/Mitcad", tag = "v0.74.0" }

[build-dependencies]
cxx-build = { version = "1.0", optional = true }

[profile.release]
debug = 1
